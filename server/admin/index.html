<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Clock Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1 class="eyebrow masthead-title">Memory Clock Admin</h1>
      <button id="logout" class="quiet hidden" type="button">Sign out</button>
    </header>

    <section id="login-view" class="login-card hidden" aria-labelledby="login-heading">
      <p class="eyebrow">Private access</p>
      <h2 id="login-heading">Sign in</h2>
      <p class="muted">Use your admin token or select the token file.</p>
      <form id="login-form">
        <label for="admin-token">Admin token</label>
        <input id="admin-token" name="token" type="password" autocomplete="current-password">
        <div class="or"><span>or</span></div>
        <label class="file-picker" for="auth-file">Choose auth file</label>
        <input id="auth-file" type="file" accept=".token,.txt,text/plain">
        <p id="file-name" class="file-name muted">No file selected</p>
        <button class="primary" type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="admin-view" class="hidden">
      <nav class="tabs" aria-label="Admin sections" role="tablist">
        <button id="clients-tab" class="tab selected" data-view="clients" type="button"
                role="tab" aria-controls="clients-view" aria-selected="true"
                tabindex="0">Clocks</button>
        <button id="pages-tab" class="tab" data-view="pages" type="button"
                role="tab" aria-controls="pages-view" aria-selected="false"
                tabindex="-1">Pages</button>
        <button id="calendar-tab" class="tab" data-view="calendar" type="button"
                role="tab" aria-controls="calendar-view" aria-selected="false"
                tabindex="-1">Calendar</button>
      </nav>

      <section id="clients-view" class="view" role="tabpanel" aria-labelledby="clients-tab">
        <div id="clients" class="client-grid" aria-live="polite"></div>
      </section>

      <section id="pages-view" class="view hidden" role="tabpanel"
               aria-labelledby="pages-tab">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Effective calendar</p>
            <h2 id="pages-heading">Available pages</h2>
          </div>
        </div>
        <p class="muted">These are the appointment panels sent to the clocks.</p>
        <div id="pages" class="page-grid" aria-live="polite"></div>
      </section>

      <section id="calendar-view" class="view hidden" role="tabpanel"
               aria-labelledby="calendar-tab">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Read-only source</p>
            <h2 id="calendar-heading">calendar.yaml</h2>
          </div>
        </div>
        <pre id="calendar" tabindex="0"></pre>
      </section>

      <p id="admin-error" class="error" role="alert"></p>
    </section>
  </main>
  <script src="admin.js" defer></script>
</body>
</html>
